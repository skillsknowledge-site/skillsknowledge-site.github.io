<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Submit an appeal · SkillsKnowledge</title><meta name="robots" content="noindex"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="redesign.css"><link rel="stylesheet" href="flow.css"><link rel="stylesheet" href="polish.css">
</head>
<body><main class="appeal-shell"><a class="close-only" href="account.html" aria-label="Close appeal">×</a><div id="appeal-form-view"><div class="flow-heading"><p class="eyebrow">Account support</p><h1>Submit an appeal</h1><p>If your account was blocked by mistake, explain what happened and we’ll review it.</p></div><form id="appeal-form" class="flow-card flow-fields"><label>Email, username or phone<input name="identifier" autocomplete="username" required placeholder="Enter the details for the blocked account"></label><label>What would you like us to review?<textarea name="appeal" required minlength="5" maxlength="1000" placeholder="Explain what happened and include any details that may help us review your request."></textarea></label><p class="flow-note">Appeals are limited to one open request per account each day.</p><p id="appeal-error" class="flow-message" role="alert" hidden></p><button class="flow-primary" type="submit">Submit</button></form></div>
<section id="appeal-success" class="flow-success" hidden><div class="success-mark">✓</div><p class="eyebrow">Appeal submitted</p><h1>Your appeal is under review</h1><p>We’ve received your appeal. We’ll review it within 2–3 days.</p></section></main><script src="config.js" defer></script><script src="appeal.js" defer></script></body></html>
