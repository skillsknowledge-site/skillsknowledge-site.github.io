<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="appeal.css">

</head>
<body data-pp>
<div class="bgfx" aria-hidden="true"><i class="a"></i><i class="b"></i></div>
<canvas class="snow" id="snow" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="sp" viewBox="0 0 24 24"><path d="M12 0C12.6 7.2 16.8 11.4 24 12 16.8 12.6 12.6 16.8 12 24 11.4 16.8 7.2 12.6 0 12 7.2 11.4 11.4 7.2 12 0Z"/></symbol></svg>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="index.html" aria-label="SK, home">
      <svg viewBox="1.1 1.5 131.8 97.0" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"><polyline points="60.4,8 24.4,8 16.6,47 52.6,47 43.6,92 7.6,92"/><polyline points="84.4,8 67.6,92"/><polyline points="126.4,8 87.8,41"/><polyline points="76.8,51 107.6,92"/></g></svg>
    </a>
    <a class="btn btn-solid btn-sm home-btn" href="index.html"><i></i><i></i><i></i><i></i>Home</a>
  </div>
</header>
<main class="ap"><div class="ap-wrap">
  <a class="ap-x" href="login.html" aria-label="Close and go back to log in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  <p class="ap-eye">Account support</p>
  <h1>Submit an appeal</h1>
  <p class="ap-sub">If your account was blocked by mistake, explain what happened and we will review it.</p>
  <form class="ap-card" id="ap-form" novalidate>
    <label class="ap-f"><span>Email, username or phone</span><input id="ap-id" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Enter the details for the blocked account"></label>
    <label class="ap-f"><span>What would you like us to review?</span><textarea id="ap-msg" rows="9" maxlength="1000" placeholder="Explain what happened and include any details that may help us review your request."></textarea></label>
    <p class="ap-st" id="ap-st" role="status"></p>
    <button class="btn btn-solid" type="submit" id="ap-go">Submit</button>
  </form>
  <div class="ap-card ap-done" id="ap-done" hidden>
    <svg class="ap-tick" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="25"/><path d="M15.5 27l7.5 7.5L37 19.5"/></svg>
    <p class="ap-dt">We will respond in 2&ndash;3 days of your submission.</p>
  </div>
</div></main>

<script src="site-data.js" defer></script>
<script src="sk-defaults.js" defer></script>
<script src="sk-data.js" defer></script>
<script src="script.js" defer></script>

<script src="appeal.js" defer></script>
</body>
</html>
